<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Резервация</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='reserve.css') }}">
</head>
<body>
    <h1>Направи резервация</h1>
    <form method="POST">
        <input type="text" name="name" placeholder="Име" required><br>
        <input type="tel" name="phone" placeholder="Телефон" required><br>
        <input type="date" name="date" required><br>
        <input type="time" name="time" required><br>
        <input type="number" name="guests" placeholder="Брой места" min="1" required><br>
        <button type="submit">Резервирай</button>
    </form>
    <br>
    <a href="{{ url_for('client_panel') }}">⬅ Назад</a>
</body>
</html>
