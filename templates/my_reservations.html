<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Моите резервации</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='my_reservations.css') }}">
</head>
<body>

    <h1>Моите резервации</h1>

    {% if reservations %}
    <table border="1" cellpadding="10">
        <tr>
            <th>#</th>
            <th>Име</th>
            <th>Телефон</th>
            <th>Дата</th>
            <th>Час</th>
            <th>Гости</th>
            <th>Записана на</th>
        </tr>
        {% for r in reservations %}
        <tr>
            <td>{{ r.id }}</td>
            <td>{{ r.customer_name }}</td>
            <td>{{ r.phone }}</td>
            <td>{{ r.date }}</td>
            <td>{{ r.time }}</td>
            <td>{{ r.guests }}</td>
            <td>{{ r.created_at }}</td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
        <p>Нямате направени резервации.</p>
    {% endif %}

    <br>
    <a href="{{ url_for('client_panel') }}">⬅ Назад</a>

</body>
</html>
