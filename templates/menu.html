<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Website</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='menu.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='image/short_icon.png') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" />
</head>
<body>

    <!-- Navigation -->
    <nav>
        <div class="logo">
            <a href="{{ url_for('client_panel') }}">
                <img src="{{ url_for('static', filename='image/logo.png') }}">
            </a>
        </div>
        <ul>
            <li><a href="client_panel" class="action">Home</a></li>
            <li><a href="about">About</a></li>
            <li><a href="menu">Menu</a></li>
            <li><a href="gallery">Gallery</a></li>
            <li><a href="{{ url_for('order_page') }}">Order</a></li>
        </ul>
        <div class="login">
            <a href="logout">Logout</a>
        </div>
    </nav>

    <!-- Banner -->
    <div class="banner_bg">
        <h1>Our <span>Menu</span></h1>
    </div>

    <!-- Dynamic Menu Section -->
    <div class="menu">
        <div class="menu_box anim">

            {% for dish in dishes %}
            <div class="menu_card">
                <div class="menu_img">
                    <img src="{{ url_for('static', filename='image/' + dish.image_filename) }}">
                </div>
                <div class="menu_text">
                    <h2>{{ dish.name }}</h2>
                    <p>{{ dish.description }}</p>
                    <div class="menu_icon">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star-half-stroke"></i>
                    </div>

                    {% if dish.availability %}
                        <p class="price">${{ dish.price }}<sub><del>${{ (dish.price + 2)|round(2) }}</del></sub></p>
                        <a href="{{ url_for('quick_order', dish_id=dish.id) }}" class="menu_btn">
                            <i class="fa-solid fa-burger"></i> Order Now
                        
                        </a>
                    {% else %}
                        <p class="price"><s>Изчерпано</s></p>
                    {% endif %}
                </div>
            </div>
            {% endfor %}

        </div>
    </div>

</body>
</html>
