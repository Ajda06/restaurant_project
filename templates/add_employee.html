<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Добавяне на служител</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='static/add_employee.css') }}">
</head>
<body>
    <div class="container">
        <h2>Добави нов служител</h2>
        <form method="POST" action="{{ url_for('add_employee') }}">
            <label for="name">Име:</label>
            <input type="text" id="name" name="name" required>

            <label for="role">Роля:</label>
            <select id="role" name="role" required>
                <option value="server">Сервитьор</option>
                <option value="chef">Готвач</option>
                <option value="admin">Администратор</option>
            </select>

            <label for="phone">Телефон:</label>
            <input type="text" id="phone" name="phone" required>

            <button type="submit">Добави</button>
        </form>
        <br>
        <a href="{{ url_for('manage_employees') }}">⬅ Назад към служителите</a>
    </div>
</body>
</html>
